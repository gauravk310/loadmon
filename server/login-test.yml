# ═══════════════════════════════════════════════════════════════
#  GradeMeAI Load Test — Student Login
#  Powered by Artillery (https://artillery.io)
# ═══════════════════════════════════════════════════════════════
#
#  Usage:
#    npm run test:quick       →  Quick validation (~50 requests)
#    npm run test:moderate    →  Moderate load (~100 concurrent VUs)
#    npm run test:heavy       →  Heavy load (~2,000 concurrent VUs)
#    npm run test:stress      →  Stress test (~3,000+ concurrent VUs)
#
#  Generate HTML Report:
#    npm run report
#
#  Custom run:
#    npx artillery run Login/login-test.yml -e heavy -o results.json
#    npx artillery report results.json
#
# ═══════════════════════════════════════════════════════════════

config:
  target: "{{ $processEnvironment.SERVER_URL }}"

  # Default headers applied to ALL requests
  defaults:
    headers:
      Content-Type: "application/json"
      Origin: "{{ $processEnvironment.APP_URL }}"

  # Custom JS processor for user assignment & response logging
  processor: "./processor.js"

  # HTTP engine settings
  http:
    timeout: 30             # Request timeout in seconds
    maxSockets: 5000        # Max concurrent TCP sockets (increase for heavy loads)

  # ─────────────────────────────────────────────────────────
  #  ENVIRONMENTS — Pick your load level
  # ─────────────────────────────────────────────────────────
  #
  #  Key concept:
  #    arrivalRate  = new virtual users spawned PER SECOND
  #    Concurrent VUs ≈ arrivalRate × avg_scenario_duration
  #
  #  Example: If each login takes ~2s (request + think time),
  #    arrivalRate: 500 → ~1,000 concurrent VUs at any moment
  #    arrivalRate: 1000 → ~2,000 concurrent VUs at any moment
  #
  # ─────────────────────────────────────────────────────────

  environments:

    # ⚡ QUICK — Validate everything works (5 users/sec for 10s)
    quick:
      phases:
        - duration: 50
          arrivalRate: 2
          name: "⚡ Quick Validation"

    # 🔥 MODERATE — Long duration at 2 users/sec
    moderate:
      phases:
        - duration: 200
          arrivalRate: 3
          name: "🚀 Sustained Moderate Load (5 minutes @ 2/sec)"

    # 💪 HEAVY — ~2,000 concurrent VUs
    heavy:
      phases:
        - duration: 30
          arrivalRate: 50
          rampTo: 500
          name: "🔥 Ramp Up to 500/sec"
        - duration: 60
          arrivalRate: 500
          name: "🚀 Peak Load (~2,000 concurrent VUs)"
        - duration: 15
          arrivalRate: 500
          rampTo: 10
          name: "🧊 Cool Down"

    # 💀 STRESS — 3,000+ concurrent VUs (use with caution!)
    stress:
      phases:
        - duration: 30
          arrivalRate: 100
          rampTo: 1000
          name: "🔥 Aggressive Ramp to 1000/sec"
        - duration: 60
          arrivalRate: 1000
          name: "💀 Stress Test (~3,000+ concurrent VUs)"
        - duration: 15
          arrivalRate: 1000
          rampTo: 10
          name: "🧊 Cool Down"

# ─────────────────────────────────────────────────────────
#  SCENARIO — What each virtual user does
# ─────────────────────────────────────────────────────────

scenarios:
  - name: "Student Login"
    flow:
      # Step 1: Assign a unique student from studentData.json
      - function: "assignUser"

      # Step 2: POST login request
      - post:
          url: "/api/auth/signin"
          headers:
            X-Forwarded-For: "{{ randomIP }}"
          json:
            email: "{{ email }}"
            password: "{{ password }}"
          afterResponse: "logResponse"

      # Step 3: Think time (simulates real user pause)
      - think: 1
